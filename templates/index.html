<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Management</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .form-row { margin: 5px 0; }
        .form-row input, .form-row select { padding: 5px; }
        .edit-form { background: #fff; padding: 10px; border: 1px solid #ddd; margin: 10px 0; display: none; }
        .edit-form.active { display: block; }
    </style>
</head>
<body>
    <h1>Device Management</h1>
    
    <h2>Add User</h2>
    <form method="POST" action="/update">
        <div class="form-row">
            <input type="text" name="username" placeholder="Username" required>
            <input type="text" name="attribute" placeholder="Attribute" required>
            <select name="op" required>
                <option value="=">=</option>
                <option value=":=">:=</option>
                <option value="==">==</option>
            </select>
            <input type="text" name="value" placeholder="Value" required>
            <button type="submit">Save</button>
        </div>
    </form>

    <div id="editForm" class="edit-form">
        <h3>Edit User</h3>
        <form method="POST" action="/update">
            <input type="hidden" name="old_username" id="old_username">
            <input type="hidden" name="old_attribute" id="old_attribute">
            <div class="form-row">
                <input type="text" name="username" id="edit_username" placeholder="Username" required>
                <input type="text" name="attribute" id="edit_attribute" placeholder="Attribute" required>
                <select name="op" id="edit_op" required>
                    <option value="=">=</option>
                    <option value=":=">:=</option>
                    <option value="==">==</option>
                </select>
                <input type="text" name="value" id="edit_value" placeholder="Value" required>
                <button type="submit">Update</button>
                <button type="button" onclick="hideEditForm()">Cancel</button>
            </div>
        </form>
    </div>

    <h2>Users</h2>
    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Attribute</th>
                <th>Op</th>
                <th>Value</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.attribute }}</td>
                <td>{{ user.op }}</td>
                <td>{{ user.value }}</td>
                <td>
                    <button class="edit-btn" data-username="{{ user.username }}" data-attribute="{{ user.attribute }}" data-op="{{ user.op }}" data-value="{{ user.value }}">Edit</button>
                    <form method="POST" action="/delete" style="display: inline;">
                        <input type="hidden" name="username" value="{{ user.username }}">
                        <input type="hidden" name="attribute" value="{{ user.attribute }}">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.edit-btn').forEach(button => {
                button.addEventListener('click', function() {
                    document.getElementById('old_username').value = this.dataset.username;
                    document.getElementById('old_attribute').value = this.dataset.attribute;
                    document.getElementById('edit_username').value = this.dataset.username;
                    document.getElementById('edit_attribute').value = this.dataset.attribute;
                    document.getElementById('edit_op').value = this.dataset.op;
                    document.getElementById('edit_value').value = this.dataset.value;
                    document.getElementById('editForm').classList.add('active');
                });
            });
        });
        function hideEditForm() {
            document.getElementById('editForm').classList.remove('active');
        }
    </script>
</body>
</html>
